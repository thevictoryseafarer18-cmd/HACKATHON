<style>
:root{--ink:#0B3C49;--sun:#FFC233;--sky:#E3F1F0;--rose:#D6336C;--white:#fff}
*{box-sizing:border-box;margin:0}
body{font-family:"Noto Sans","Noto Sans Devanagari","Noto Sans Tamil","Noto Sans Telugu",system-ui,sans-serif;background:var(--sky);color:var(--ink);min-height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:520px;padding:20px 16px 32px;display:flex;flex-direction:column;gap:16px}
h1{font-size:1.9rem;line-height:1.3}
p.big{font-size:1.45rem;line-height:1.55;font-weight:600}
button{font:inherit;color:inherit;border:0;cursor:pointer;border-radius:20px;min-height:76px;padding:12px 18px}
button:focus-visible{outline:4px solid var(--rose);outline-offset:3px}
.card{background:var(--white);box-shadow:0 3px 0 rgba(11,60,73,.25);font-size:1.6rem;font-weight:700;display:flex;align-items:center;gap:16px;text-align:left;width:100%}
.card .ic{font-size:2.4rem}
.card small{display:block;font-size:1rem;font-weight:500;opacity:.7}
.mic{background:var(--rose);color:#fff;width:140px;height:140px;border-radius:50%;align-self:center;font-size:3.6rem;position:relative}
.mic.on::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:5px solid var(--rose);animation:p 1s infinite}
@keyframes p{from{transform:scale(.9);opacity:1}to{transform:scale(1.2);opacity:0}}
@media(prefers-reduced-motion:reduce){.mic.on::after{animation:none}}
.row{display:flex;gap:12px}.row button{flex:1;font-size:1.4rem;font-weight:700}
.go{background:var(--sun)}.soft{background:var(--white)}
.step{background:var(--white);border-radius:24px;padding:22px;border-left:12px solid var(--sun)}
.dots{display:flex;gap:8px;justify-content:center}.dots i{width:16px;height:16px;border-radius:50%;background:#b9d3d1}.dots i.on{background:var(--ink)}
.tip{background:var(--ink);color:#fff;border-radius:20px;padding:16px;font-size:1.1rem;line-height:1.5}
.status{text-align:center;font-size:1.2rem;min-height:1.6em;font-weight:600}
[hidden]{display:none!important}
</style>
</head>
<body>

   "சொல்லுங்கள்: எனக்கு ஆயுஷ்மான் அட்டை வேண்டும். அவர்கள் சரிபார்த்து அட்டை தருவார்கள்.",
   "இந்த அட்டையால் குடும்பத்திற்கு ஆண்டுக்கு ஐந்து லட்சம் ரூபாய் வரை இலவச சிகிச்சை. உதவிக்கு அழைக்கவும்: ஒன்று நான்கு ஐந்து ஐந்து ஐந்து."]}}},

  ask:"మీకు ఏమి కావాలి? మాట్లాడటానికి ఎరుపు మైక్ నొక్కండి, లేదా కింద ఎంచుకోండి.",
  listening:"వింటున్నాను…",unknown:"అర్థం కాలేదు. కింద ఎంచుకోండి.",next:"తరువాత",back:"వెనుకకు",again:"🔊 మళ్ళీ వినండి",
  done:"మీ పని అయింది. అభినందనలు!",home:"మొదటికి",
  tip:"అర్థం కాకపోతే అంగన్‌వాడీ లేదా ఆశా అక్కను అడగండి.",

  svc:{bank:{t:"బ్యాంకు ఖాతా",s:"జన్ ధన్ ఖాతా, ఉచితం",steps:[
   "మీకు ఆధార్ కార్డు, మొబైల్ ఫోన్ కావాలి.",
   "దగ్గరలోని బ్యాంకుకు లేదా బ్యాంక్ మిత్ర దగ్గరకు వెళ్ళండి. చెప్పండి: నాకు జన్ ధన్ ఖాతా తెరవాలి.",
   "ఫారం నింపడానికి బ్యాంకు సిబ్బంది సహాయం చేస్తారు. ఖాతాలో డబ్బు ఉంచాల్సిన అవసరం లేదు.",

  health:{t:"ఆరోగ్య కార్డు",s:"ఆయుష్మాన్ కార్డు, ఉచిత చికిత్స",steps:[
   "మీకు ఆధార్ కార్డు, రేషన్ కార్డు కావాలి.",

   "You need your Aadhaar card and ration card.",

};
const ICON={bank:"🏦",health:"🏥"};
const app=document.getElementById("app");
let lang=null,svc=null,i=0;
const synth=window.speechSynthesis;
function say(text,code){ if(!synth)return; synth.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang=code; u.rate=.85; synth.speak(u); }
const el=(h)=>{app.innerHTML=h};

function pickLang(){
  svc=null;lang=null;
  el(`<h1>सखी · தோழி · సఖి</h1>
  <p class="big">🔊 👇</p>
  ${Object.keys(L).map(k=>`<button class="card" data-l="${k}"><span class="ic">🔊</span>${L[k].name}</button>`).join("")}`);
  app.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{lang=b.dataset.l;home(true)});
}
function home(greet){
  const t=L[lang];svc=null;
  el(`<p class="big">${t.ask}</p>
  <button class="mic" id="mic" aria-label="Speak">🎤</button>
  <div class="status" id="st"></div>
  ${Object.keys(t.svc).map(k=>`<button class="card" data-s="${k}"><span class="ic">${ICON[k]}</span><span>${t.svc[k].t}<small>${t.svc[k].s}</small></span></button>`).join("")}
  <button class="soft" id="re">${t.again}</button>`);
  say((greet?t.hello+" ":"")+t.ask,t.speech);
  app.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{svc=b.dataset.s;i=0;show()});
  document.getElementById("re").onclick=()=>say(t.ask,t.speech);
  document.getElementById("mic").onclick=listen;
}
function listen(){
  const t=L[lang],st=document.getElementById("st"),mic=document.getElementById("mic");
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){st.textContent=t.unknown;say(t.unknown,t.speech);return}
  synth&&synth.cancel();
  const r=new SR();r.lang=t.speech;r.interimResults=false;
  mic.classList.add("on");st.textContent=t.listening;
  r.onresult=e=>{
    const said=e.results[0][0].transcript.toLowerCase();
    // understand her words in ANY supported language, not just the chosen one
    const hit=Object.keys(t.svc).find(k=>Object.values(L).some(l=>l.kw[k].some(w=>said.includes(w.toLowerCase()))));
    if(hit){svc=hit;i=0;show()}else{st.textContent=t.unknown;say(t.unknown,t.speech)}
  };
  r.onerror=()=>{st.textContent=t.unknown;say(t.unknown,t.speech)};
  r.onend=()=>mic.classList.remove("on");
  r.start();
}
function show(){
  const t=L[lang],s=t.svc[svc],n=s.steps.length,last=i===n-1;
  el(`<p class="big">${s.t}</p>
  <div class="dots">${s.steps.map((_,j)=>`<i class="${j<=i?"on":""}"></i>`).join("")}</div>
  <div class="step"><p class="big">${s.steps[i]}</p></div>
  <button class="soft" id="re">${t.again}</button>
  <div class="row"><button class="soft" id="bk">◀ ${t.back}</button>
  <button class="go" id="nx">${last?"✔":t.next+" ▶"}</button></div>
  ${last?`<div class="tip">${t.done}<br>${t.tip}</div>`:""}`);
  say(s.steps[i]+(last?" "+t.done+" "+t.tip:""),t.speech);
  document.getElementById("re").onclick=()=>say(s.steps[i],t.speech);
  document.getElementById("bk").onclick=()=>{i>0?(i--,show()):home()};
  document.getElementById("nx").onclick=()=>{last?pickLang():(i++,show())};
}
pickLang();
</script>
